name: PR check

on:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: assets, email, scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check local assets, contact email, and scripts
        run: python3 .github/workflows/check_site.py
